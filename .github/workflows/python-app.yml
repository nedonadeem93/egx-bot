name: Run EGX Bot

on:
  schedule:
    - cron: '0 * * * *'  # بيشتغل تلقائياً كل ساعة
  workflow_dispatch:      # بيخليك تقدر تشغله بايدك في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repo
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run bot
      run: |
        python bot.py
